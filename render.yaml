services:
  - type: keyvalue
    name: demka-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: demka-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: cd django && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    releaseCommand: >-
      cd django && python manage.py migrate --noinput &&
      python manage.py seed_payment_methods &&
      python manage.py seed_expense_categories &&
      python manage.py seed_stock_locations &&
      (if [ "$DJANGO_SEED_CATALOGUE" = "true" ]; then
      python manage.py generate_catalogue_seed --built-in --seed; fi)
    healthCheckPath: /api/health/
    envVarGroups:
      - demka-runtime
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://${{demka-frontend.host}}
      - key: PYTHON_VERSION
        value: 3.12.8
    autoDeploy: true
    disk:
      name: demka-media
      mountPath: /opt/render/project/src/backend/django/media
      sizeGB: 1

  - type: worker
    name: demka-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: cd django && celery -A config worker --loglevel=info
    envVarGroups:
      - demka-runtime
    autoDeploy: true

  - type: worker
    name: demka-beat
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: cd django && celery -A config beat --loglevel=info
    envVarGroups:
      - demka-runtime
    autoDeploy: true

  - type: static_site
    name: demka-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://${{demka-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: demka-db
    databaseName: demka
    user: demka
    plan: basic-256mb

envVarGroups:
  - name: demka-runtime
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: demka-api.onrender.com
      - key: POSTGRES_HOST
        fromDatabase:
          name: demka-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: demka-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: demka-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: demka-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: demka-db
          property: password
      - key: REDIS_URL
        value: ${{demka-redis.connectionString}}/2
      - key: CELERY_BROKER_URL
        value: ${{demka-redis.connectionString}}/0
      - key: CELERY_RESULT_BACKEND
        value: ${{demka-redis.connectionString}}/1
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: ots
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: DJANGO_SEED_CATALOGUE
        value: "false"
