services:
  - type: keyvalue
    name: demka-redis
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: demka-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: >-
      cd django && python manage.py migrate --noinput &&
      python manage.py seed_payment_methods &&
      python manage.py seed_expense_categories &&
      python manage.py seed_stock_locations &&
      (if [ "$DJANGO_SEED_CATALOGUE" = "true" ]; then
      python manage.py generate_catalogue_seed --built-in --seed; fi) &&
      python manage.py ensure_admin_user &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - fromGroup: demka-runtime
      - key: CORS_ALLOWED_ORIGINS
        value: https://demka-frontend.onrender.com
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: demka-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: demka-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: demka-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: demka-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: demka-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
    autoDeploy: true

  - type: worker
    name: demka-worker
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: cd django && celery -A config worker --loglevel=info
    envVars:
      - fromGroup: demka-runtime
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: demka-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: demka-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: demka-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: demka-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: demka-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
    autoDeploy: true

  - type: worker
    name: demka-beat
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: cd django && celery -A config beat --loglevel=info
    envVars:
      - fromGroup: demka-runtime
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: demka-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: demka-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: demka-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: demka-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: demka-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: demka-redis
          property: connectionString
    autoDeploy: true

  - type: web
    name: demka-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://${{demka-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: demka-db
    databaseName: demka
    user: demka
    plan: free
    region: ohio

envVarGroups:
  - name: demka-runtime
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: demka-api.onrender.com
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: ots
      - key: DJANGO_SEED_CATALOGUE
        value: "false"
